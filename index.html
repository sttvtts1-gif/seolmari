<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전화 알림</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#10192e"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#0c1324;--panel:#141d33;--panel2:#1a2440;--line:#26314f;--amber:#e8952f;--ink:#eef1fa;--sub:#929bb4;--red:#e0596a;--green:#33b17a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px 16px 40px}.status{width:max-content;max-width:100%;margin:0 auto 12px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:#f4b95c;font-size:12px}h1{text-align:center;margin:4px 0 2px;font-size:32px}.subtitle{text-align:center;color:var(--red);font-weight:800;font-size:12px;letter-spacing:2px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}.card h2{font-size:14px;color:var(--sub);margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}label{display:block;font-size:11px;color:var(--sub);margin:0 0 6px 2px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--ink);padding:12px;font:inherit;font-size:14px}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:13px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,#5a86ff,#3f66e6);color:white}.quick{width:100%;background:var(--amber);color:#241500;margin-bottom:14px}.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.danger{background:#421f2a;color:#ff9bab}.done{background:#173d32;color:#6fe0af}.banner{display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin-bottom:14px;border:1px solid #7c5729;border-radius:14px;background:#302516;color:#ffd18e;font-size:12px}.banner button{padding:8px;background:var(--amber)}.entry{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}.entry.due{border-color:var(--red)}.company{font-weight:800}.phone,.meta{color:var(--sub);font-size:12px}.memo{font-size:13px;margin:7px 0;white-space:pre-wrap}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{flex:1;padding:8px;font-size:12px;min-width:64px}.empty{text-align:center;color:var(--sub);padding:20px;font-size:13px}.test-note{font-size:12px;line-height:1.55;color:var(--sub);margin:-5px 0 14px}.due-title{color:#ff8291!important}.footer{text-align:center;color:var(--sub);font-size:11px;line-height:1.6;margin-top:18px}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<div class="status" id="status">알림 상태 확인 중</div><h1>전화 알림</h1><div class="subtitle">FOLLOW-UP ALARM</div>
<div class="banner" id="installBanner"><span>휴대폰 홈 화면에 앱으로 설치할 수 있습니다.</span><button id="installButton">앱 설치</button></div>
<div class="banner" id="permBanner"><span>알림 권한을 허용해야 알림을 표시할 수 있습니다.</span><button id="permButton">알림 허용</button></div>
<section class="card" id="dueSection" hidden><h2 class="due-title">지금 확인 필요</h2><div id="dueList"></div></section>
<section class="card">
<button class="quick" id="quickButton">⏱ 테스트 알람을 1분 뒤로 설정</button><p class="test-note">버튼을 누르면 테스트 알림이 바로 저장됩니다. 알림이 울릴 때까지 이 화면을 켜 두세요.</p>
<h2>1. 업체 / 연락처</h2><div class="grid"><div class="field"><input id="company" placeholder="업체명"></div><div class="field"><input id="phone" placeholder="연락처" inputmode="tel"></div></div>
<h2>2. 알림 일시</h2><div class="grid"><div class="field"><label for="date">날짜</label><input id="date" type="date"></div><div class="field"><label for="time">시간</label><input id="time" type="time" step="60"></div></div>
<h2>3. 반복</h2><div class="field"><select id="repeat"><option value="once">한 번</option><option value="daily">매일</option><option value="weekly">매주</option></select></div>
<h2>4. 메모</h2><div class="field"><textarea id="memo" placeholder="메모 내용을 입력하세요"></textarea></div><input id="editId" type="hidden"><button class="primary" id="saveButton">알림 저장</button>
</section><section class="card"><h2>설정된 알림</h2><div id="list"></div></section><div class="footer">웹앱 알림은 브라우저와 운영체제의 절전 정책에 영향을 받습니다.<br>1분 테스트 중에는 앱 화면을 켜 두는 것이 가장 확실합니다.</div>
</main><script>
const KEY='jjanae_entries_v2', $=id=>document.getElementById(id);let swReg=null,deferredInstallPrompt=null;
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},store=list=>localStorage.setItem(KEY,JSON.stringify(list)),pad=n=>String(n).padStart(2,'0');
const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,localTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setFormTime(d){$('date').value=localDate(d);$('time').value=localTime(d)}
function resetForm(){['company','phone','memo','editId'].forEach(id=>$(id).value='');$('repeat').value='once';setFormTime(new Date(Date.now()+300000))}
function formTimestamp(){return new Date(`${$('date').value}T${$('time').value}:00`).getTime()}
async function ensurePermission(){if(!('Notification'in window))return false;if(Notification.permission==='granted')return true;if(Notification.permission==='default')return(await Notification.requestPermission())==='granted';return false}
function updatePermission(){const p=('Notification'in window)?Notification.permission:'unsupported';$('status').textContent=p==='granted'?'● 알림 사용 가능':p==='denied'?'알림이 차단됨 — 브라우저 설정에서 허용 필요':p==='default'?'알림 권한 필요':'이 브라우저는 알림을 지원하지 않음';$('permBanner').style.display=p==='granted'?'none':'flex'}
function saveEntry(v){const company=(v?.company??$('company').value).trim(),phone=(v?.phone??$('phone').value).trim(),memo=(v?.memo??$('memo').value).trim(),fireAt=v?.fireAt??formTimestamp(),repeat=v?.repeat??$('repeat').value,editId=v?.editId??$('editId').value;if(!company||!phone||!Number.isFinite(fireAt)){alert('업체명, 연락처, 알림 일시를 입력해 주세요.');return false}if(fireAt<=Date.now()){alert('현재보다 뒤의 시간을 선택해 주세요.');return false}let list=load();const entry={id:editId||`e_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,company,phone,memo,repeat,nextFireAt:fireAt,lastFiredFor:null,done:false,createdAt:Date.now()};list=editId?list.map(e=>e.id===editId?{...e,...entry}:e):[...list,entry];store(list);resetForm();render();ensurePermission().then(updatePermission);return true}
async function quickTest(){const fireAt=Date.now()+60000;if(saveEntry({company:'1분 알람 테스트',phone:'010-0000-0000',memo:'알림 기능 테스트',fireAt,repeat:'once'})){await ensurePermission();updatePermission();alert(`테스트 알람을 ${new Date(fireAt).toLocaleTimeString('ko-KR')}로 설정했습니다. 이 화면을 켜 두세요.`)}}
function removeEntry(id){if(confirm('이 알림을 삭제할까요?')){store(load().filter(e=>e.id!==id));render()}}function completeEntry(id){store(load().map(e=>e.id===id?{...e,done:true}:e));render()}function snooze(id){store(load().map(e=>e.id===id?{...e,nextFireAt:Date.now()+60000,lastFiredFor:null,done:false}:e));render()}
function editEntry(id){const e=load().find(x=>x.id===id);if(!e)return;$('company').value=e.company;$('phone').value=e.phone;$('memo').value=e.memo||'';$('repeat').value=e.repeat||'once';$('editId').value=e.id;setFormTime(new Date(e.nextFireAt));scrollTo({top:0,behavior:'smooth'})}function callPhone(p){location.href=`tel:${p.replace(/[^0-9+]/g,'')}`}
function countdown(ts){const sec=Math.ceil((ts-Date.now())/1000);if(sec<=0)return'지금';if(sec<60)return`${sec}초 뒤`;const min=Math.ceil(sec/60);if(min<60)return`${min}분 뒤`;return`${Math.floor(min/60)}시간 ${min%60}분 뒤`}
function card(e,due){return`<article class="entry ${due?'due':''}"><div class="company">${esc(e.company)}</div><div class="phone">${esc(e.phone)}</div>${e.memo?`<div class="memo">${esc(e.memo)}</div>`:''}<div class="meta">${due?'알림 시간 도착':countdown(e.nextFireAt)} · ${new Date(e.nextFireAt).toLocaleString('ko-KR')} · ${e.repeat==='daily'?'매일':e.repeat==='weekly'?'매주':'한 번'}</div><div class="actions"><button class="done" onclick="callPhone('${esc(e.phone)}')">전화</button><button class="done" onclick="completeEntry('${e.id}')">완료</button><button class="secondary" onclick="snooze('${e.id}')">1분 미루기</button><button class="secondary" onclick="editEntry('${e.id}')">수정</button><button class="danger" onclick="removeEntry('${e.id}')">삭제</button></div></article>`}
function render(){const entries=load().filter(e=>!e.done).sort((a,b)=>a.nextFireAt-b.nextFireAt),due=entries.filter(e=>e.nextFireAt<=Date.now()),future=entries.filter(e=>e.nextFireAt>Date.now());$('dueSection').hidden=!due.length;$('dueList').innerHTML=due.map(e=>card(e,true)).join('');$('list').innerHTML=future.length?future.map(e=>card(e,false)).join(''):'<div class="empty">설정된 알림이 없습니다.</div>'}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.8);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.8)}catch{}if(navigator.vibrate)navigator.vibrate([300,150,300])}
function notify(e){const title=`전화할 시간: ${e.company}`,body=`${e.phone}${e.memo?' · '+e.memo:''}`;beep();if(swReg?.active)swReg.active.postMessage({type:'SHOW_ALARM',title,body,tag:e.id,entryId:e.id});else if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body,icon:'./icon-192.png',tag:e.id,requireInteraction:true})}
function nextOccurrence(e){if(e.repeat==='once')return null;const d=new Date(e.nextFireAt),days=e.repeat==='weekly'?7:1;do{d.setDate(d.getDate()+days)}while(d.getTime()<=Date.now());return d.getTime()}
function checkAlarms(){let list=load(),changed=false;for(const e of list)if(!e.done&&e.nextFireAt<=Date.now()&&e.lastFiredFor!==e.nextFireAt){notify(e);e.lastFiredFor=e.nextFireAt;const next=nextOccurrence(e);if(next){e.nextFireAt=next;e.lastFiredFor=null}changed=true}if(changed)store(list);render()}
$('saveButton').onclick=()=>saveEntry();$('quickButton').onclick=quickTest;$('permButton').onclick=()=>ensurePermission().then(updatePermission);
$('installButton').onclick=async()=>{if(!deferredInstallPrompt){alert('Chrome 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택해 주세요.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$('installBanner').style.display='none'};
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;$('installBanner').style.display='flex'});
window.addEventListener('appinstalled',()=>{$('installBanner').style.display='none';deferredInstallPrompt=null});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(async reg=>{await navigator.serviceWorker.ready;swReg=reg}).catch(console.error);
resetForm();updatePermission();render();checkAlarms();setInterval(checkAlarms,1000);
</script></body></html>
